name: lapor
description: Aplikasi Lapor Kerusakan Fasilitas Kampus
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Format angka Rupiah (sudah dipakai sejak P03)
  intl: ^0.19.0

  # Penyimpanan aman: Keystore (Android) & Keychain (iOS)
  flutter_secure_storage: ^11.0.0

  # Hash PIN dengan PBKDF2 yang aman
  cryptography: ^2.7.0

  # State management (dipakai mulai M04)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true